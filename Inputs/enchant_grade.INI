; Custom enchant grade labels.
; Format: grade number = label without brackets.
; The client adds the brackets, so "1=Rare" displays as "[Rare] Item Name".
; This map is active only when CustomEnchantGradeLabels is selected.
; Otherwise grades 1-4 remain D, C, B, and A. The grade number is
; authoritative; text sent in _GRADE_<n>_<text> is ignored.
;
; You can add future grades here if your client/server starts using them:
; 5=Ancient
; 6=Divine

1=Rare
2=Epic
3=Mythic
4=Legendary

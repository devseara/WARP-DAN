<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novice idle and walking collar comparison</title>
<style>body{background:#111923;color:#e8edf3;font:15px Segoe UI,Arial;margin:24px}h1{font-size:27px}p{max-width:1080px;color:#bacbd7;line-height:1.5}button,select{font:inherit;padding:8px;border-radius:5px;border:1px solid #587081;background:#293c4d;color:white}label{display:inline-flex;gap:8px;align-items:center;margin:8px 15px 8px 0}.stage{display:grid;grid-template-columns:repeat(3,max-content);gap:16px;overflow:auto}figure{margin:0}figcaption{padding:10px 0;color:#b9dfec}canvas{width:336px;height:352px;image-rendering:pixelated;background:#273442;border:1px solid #496172}.magenta canvas{background:#d02bad}.black canvas{background:#050608}.checker canvas{background:repeating-conic-gradient(#6b737e 0% 25%,#a0a7ae 0% 50%) 0/16px 16px}a{color:#9de6c9}#status{font:13px monospace}</style>
<h1>Idle collar versus walking</h1><p>The idle collar now sits below the chin at a height consistent with the original neckline. The native head and accepted body width are unchanged. Walking is the exact accepted v4 artwork.</p>
<div><label>Direction <select id="direction"></select></label><label>Idle head pose <select id="head"><option value="0">1</option><option value="1">2</option><option value="2">3</option></select></label><label><input id="heads" type="checkbox" checked>Original heads</label><label>Zoom <select id="zoom"><option value="2" selected>2x</option><option value="3">3x</option><option value="4">4x</option></select></label><label>Background <select id="background"><option>slate</option><option>black</option><option>magenta</option><option>checker</option></select></label></div>
<div><button id="play">Play walking</button> <button id="previous">Previous walk phase</button> <button id="next">Next walk phase</button> <span id="status"></span></div>
<div id="stage" class="stage"><figure><figcaption>Accepted v4 idle</figcaption><canvas width="336" height="352" data-slot="0"></canvas></figure><figure><figcaption>Corrected v5 idle</figcaption><canvas width="336" height="352" data-slot="1"></canvas></figure><figure><figcaption>Accepted walking · unchanged</figcaption><canvas width="336" height="352" data-slot="2"></canvas></figure></div>
<p><a href="pixel-review.html">Collar pixel grids</a> · <a href="full-action-review.html">All-action original / v4 / v5 comparison</a> · <a href="release/novice-hd-idle-collar-v5.grf">GRF package</a></p>
<script>
const data=__DATA__,directions=['Front','Front-left','Left','Rear-left','Rear','Rear-right','Right','Front-right'];const $=id=>document.getElementById(id),cache=new Map();let phase=0,playing=false,last=0,revision=0;
directions.forEach((name,i)=>$('direction').add(new Option(name,i)));
function image(url){if(!cache.has(url))cache.set(url,new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error(url));im.src=url}));return cache.get(url)}
async function draw(){const rev=++revision,d=+$('direction').value,hi=+$('head').value,idle=data[d].frames[hi],walk=data[d+8].frames[phase],rows=[[idle[1],idle[3]],[idle[2],idle[3]],[walk[2],walk[3]]];$('status').textContent=`Walking phase ${phase+1}/${data[d+8].frames.length} · ${data[d+8].ms} ms`;$('stage').className='stage '+$('background').value;await Promise.all([...document.querySelectorAll('canvas')].map(async(c,i)=>{const [body,head]=await Promise.all(rows[i].map(image));if(rev!==revision)return;c.style.width=168*(+$('zoom').value)+'px';c.style.height=176*(+$('zoom').value)+'px';const ctx=c.getContext('2d');ctx.clearRect(0,0,336,352);ctx.drawImage(body,0,0);if($('heads').checked)ctx.drawImage(head,0,0)}))}
function step(delta){const n=data[8+(+$('direction').value)].frames.length;phase=(phase+delta+n)%n;draw()}
$('direction').onchange=()=>{phase=0;draw()};for(const id of ['head','heads','background','zoom'])$(id).onchange=draw;$('previous').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('play').onclick=()=>{playing=!playing;last=performance.now();$('play').textContent=playing?'Pause walking':'Play walking'};
function tick(now){if(playing&&now-last>=data[8+(+$('direction').value)].ms){last=now;step(1)}requestAnimationFrame(tick)}requestAnimationFrame(tick);draw();
</script>

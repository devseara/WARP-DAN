CustomSpecials:
    title : SPECIAL CUSTOMIZATIONS
    mutex : false
    color : deeppink
    
    patches:
        - PatchDiagnostics:
            title : Write patch diagnostics log
            recommend : no
            author : Louis T Steinhil
            desc : Writes a patch-time diagnostic log to Outputs, including selected core/custom patches, GRF mode, custom DLL import specs, slash-command registrations, and important GameSettings/UI string markers. This patch does not modify the executable.

        - CustomGameSettingsOptions:
            title : Provide Custom Game Settings Lua
            recommend : no
            author : Louis T Steinhil
            desc : Copies the custom OptionInfo/GameSettings Lua files for /shownpcname, /fps, and /ping into the target client data folder, and seeds existing savedata without overwriting player settings.

        - CustomShields:
            title : Enable Custom Shields
            recommend : no
            author : Neo-Mind , CrazyBebop
            desc : Enables custom shield sprites beyond the default set by loading shield definitions from lua files (similar to the Xray system). Required for servers with custom shield graphics.

        - AllowDualCustomWeaponSprites:
            title : Dual-Wield Per-Hand Weapon Sprites [Tracer/Experimental]
            recommend : no
            author : Louis T Steinhil
            desc : "Imports the weapon-sprite renderer DLL. Use a unique DLL name such as rename.dll when bohcustoms.dll is already used by the combined build, or rename the dedicated split output boh_weapon_sprite.dll. Current default is custom-renderer host mode: BOH_DUALWPN_NO_HOOKS=1 skips old mutating experiment hooks, BOH_DUALWPN_STATE_HOOKS=1 feeds read-only actor state, BOH_DUALWPN_PLACEMENT_TRACE=1 traces the native generic weapon holder/caller, and BOH_DUALWPN_OVERLAY=1 starts the game-owned layered renderer with ACT+SPR decode. Native replacement/draw probes remain opt-in for investigation only. Target: 2025-07-16 Ragexe 175220998. Place the selected DLL beside the patched EXE."
        
        - CustomJobs:
            title : Enable Custom Jobs (Reforged)
            recommend : no
            author : CrazyBebop
            desc : Adds support for custom job classes beyond the official set. Jobs are defined via lua files in the data folder. Required for servers with custom classes like Druid or other fan-made jobs.

        - CustomHomuns:
            title : Enable Custom Homunculi
            recommend : no
            author : Neo-Mind
            desc : Enables custom homunculus types beyond the official set using lua files. Uses the same <b>'ReqJobName'</b> function as custom jobs, so no extra configuration files are needed beyond the job lua.

        - AddLuaOverrides:
            title : Add Chris' lua overrides [Experimental]
            recommend : no
            author : llchrisll , Neo-Mind
            desc : Loads additional lua override files by llchrisll that extend and patch the client's existing lua tables and functions. Adds quality-of-life improvements and fixes. See <a href="https://llchrisll.github.io/ROTPDocs/addons/cls/?h=lua">documentation</a> for the full list of changes. Experimental.

        - AllowAPBarforAllJobs:
            title : Allow AP Bar for all Jobs
            recommend : no
            author : Skylove, Singe-Horizontal
            desc : Displays the AP (Activity Points) bar for all job classes, not just 4th jobs. Internally treats every class as a 4th job for the AP gauge check. Useful for servers that give AP to all classes.

        - RemoveMaxNumbersLimit:
            title : Remove the limit of max number displayed in damage/heal
            recommend : no
            author : 4144
            desc : Removes the cap on displayed damage, healing, and other floating numbers. Without this, very large numbers get clamped to a maximum display value. Required for high-rate servers with large damage output.

CustomSkills:
    title : SKILL CUSTOMIZATIONS
    mutex : false
    color : deeppink
    
    patches:
        - CustomPlayerSkills:
            title : Enable Custom Player skills [Experimental]
            recommend : no
            author : Unknown
            desc : Enables custom player skills beyond the official skill list by loading definitions from lua files. Required for servers that add new skills. Experimental -- may require careful lua configuration.
        
        - CustomHomunSkills:
            title : Enable Custom Homunculus skills [Experimental]
            recommend : no
            author : Unknown
            desc : Enables custom homunculus skills beyond the official list by loading definitions from lua files. Required for servers that add new homunculus abilities. Experimental.
        
        - CustomMerceSkills:
            title : Enable Custom Mercenary skills [Experimental]
            recommend : no
            author : Unknown
            desc : Enables custom mercenary skills beyond the official list by loading definitions from lua files. Required for servers that add new mercenary abilities. Experimental.

        - CustomExtName:
            title : Enable Custom Name Packets (dispatcher transport)
            recommend : no
            author : Louis T Steinhil
            desc : "Dispatcher-table shared-block path for custom extended names. Routes extended-name packet 0x0BB7 to EXTN after the stock packet reader has consumed the full packet and avoids ws2_32.recv / RecvStrip0BB6. The dedicated boh_text.dll uses WARP-time TextOutW/GetTextExtentPoint32W wrapper bridges instead of runtime GDI hooks."

        - CustomColoredItemName:
            title : Enable Custom Color Packets (dispatcher transport)
            recommend : no
            author : Louis T Steinhil
            desc : "Dispatcher-table shared-block path for custom item name colors. Routes variable item-color packet 0x0BDD to ICOL after the stock packet reader has consumed the full packet and avoids ws2_32.recv / RecvStrip0BB6. The dedicated boh_text.dll uses WARP-time TextOutW/GetTextExtentPoint32W wrapper bridges instead of runtime GDI hooks."

        - InGamePincodeUI:
            title : Enable In-Game PIN Pad
            recommend : no
            author : Louis T Steinhil
            desc : "Routes BOH map packet 0x0BEF/PINC to the selected PIN keypad DLL, then submits the normal client PIN reply packets through the native packet sender path. Use the dedicated boh_pincode_ui.dll for Gepard builds; it owns its own Win32 UI and does not patch EXE code at runtime."
